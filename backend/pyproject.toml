[project]
name = "mira"
version = "0.1.0"
description = "Mira - AI travel booking assistant for Ceylon Compass Holidays (take-home)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk>=2.15",
  "ag-ui-protocol>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "rank-bm25>=0.2.2",
  "python-dotenv>=1.0",
  "arize-phoenix-otel>=0.17",
  "openinference-instrumentation-google-adk>=1.1",
  "opentelemetry-sdk>=1.30",
  "mcp>=2.3",
  "email-validator>=2.4.0",
  "scikit-learn>=1.9.1",
  "joblib>=1.6.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mira"]
